description.Polish=Oliver Evans, będący w głębokim niepokoju o los swojej zaginionej siostry Emmy, postanawia zwrócić się do waszej grupy, która specjalizuje się w niezwykłych zjawiskach. Dnia 1 Września 1923 dzwoni do Was z prośbą o pomoc w odnalezieniu swojej siostry. Jego słowa wydają się być szczere i pełne desperacji.
description.Spanish=Oliver Evans, muy preocupado por el destino de su desaparecida hermana Emma, decide acudir a vuestro grupo, especializado en fenómenos extraordinarios. El 1 de septiembre de 1923 os llama pidiendo ayuda para encontrar a su hermana. Sus palabras parecen sinceras y llenas de desesperación. \n------------------------------------------------------------------\n\nEste es mi primer escenario, espero que os guste.\n\n------------------------------------------------------------------\n\nNota del traductor:\nEscenario sencillo, ideal para jugadores novatos.\nAdvertencia: No se aconseja para menores de 14 años.
